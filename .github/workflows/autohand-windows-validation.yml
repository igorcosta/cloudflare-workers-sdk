name: Autohand Windows validation

on:
  push:
    branches: [autohand-code-validation]

permissions:
  contents: read

jobs:
  skills:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.22.1
      - name: Install locked Wrangler dependencies
        run: pnpm install --frozen-lockfile --filter wrangler...
      - name: Build and test skills installation and updates
        run: pnpm -w test:ci -F wrangler -- agents-skills-install.test.ts
